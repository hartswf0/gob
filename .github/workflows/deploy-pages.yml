name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site bundle
        run: |
          mkdir -p site
          cp index.html site/
          cp worldtext-completions-mobile.html site/
          cp worldtext-prompt-operator.html site/
          cp worldtext-zen-reader.html site/
          cp WORLD-TEXT-DOUBLE.parsed.json site/
          cp WORLD-TEXT-DOUBLE.templates.json site/
          cp WORLD-TEXT-DOUBLE.canonical-source.md site/
          cp WORLD-TEXT-DOUBLE.MD site/
          cp WORLDTEXT.MD site/
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
